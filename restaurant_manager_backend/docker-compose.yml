services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: dreamsDeluxe
      JWT_SECRET_KEY: local-docker-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - restaurant_mongo_data:/data/db

volumes:
  restaurant_mongo_data:
